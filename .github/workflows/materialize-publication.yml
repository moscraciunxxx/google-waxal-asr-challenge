name: Materialize publication tree
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-publication.yml'
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract publication payload
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tree.tar.gz "https://files.catbox.moe/kkxpx2.gz"
          tar -xzf /tmp/tree.tar.gz
          # ensure gitignore has SSH exclusions if present in tarball
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # never commit secrets
          git reset HEAD -- '*.pem' 'id_rsa' 'id_ed25519' '**/waxal_github_deploy' 2>/dev/null || true
          git status
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Materialize full WAXAL publication tree (src, scripts, tests, submission)"
          git push origin HEAD:main
